name: Node.js PR Test Runner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.21.0]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libgtk2.0-0t64 libgtk-3-0t64 libgbm-dev libnotify-dev libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb make
      - name: Start services
        run: |
          make up-services
      - name: Wait for Keycloak to be ready
        run: |
          echo "Waiting for Keycloak..."
          until curl -s http://localhost:8080/realms/master; do
            echo "Still waiting..."
            sleep 5
          done
          echo "Keycloak is up!"

      - name: Create realm, client, and user
        run: |
          docker exec production_keycloak /opt/keycloak/bin/kcadm.sh config credentials \
            --server http://localhost:8080 \
            --realm master \
            --user admin \
            --password admin

          docker exec production_keycloak /opt/keycloak/bin/kcadm.sh create realms \
            -s realm=myrealm -s enabled=true

          docker exec production_keycloak /opt/keycloak/bin/kcadm.sh create clients -r myrealm \
            -s clientId=client-id \
            -s publicClient=false \
            -s secret=${{ secrets.KEYCLOAK_SECRET }} \
            -s 'redirectUris=["*"]' \
            -s enabled=true

          docker exec production_keycloak /opt/keycloak/bin/kcadm.sh create users -r myrealm \
            -s username=${{ secrets.KEYCLOAK_REALM_USERNAME }} \
            -s enabled=true \
            -s email=testuser@example.com \
            -s firstName=Test \
            -s lastName=Use \
            -s emailVerified=true

          docker exec production_keycloak /opt/keycloak/bin/kcadm.sh set-password -r myrealm \
            --username ${{ secrets.KEYCLOAK_REALM_USERNAME }} --new-password ${{ secrets.KEYCLOAK_REALM_PASSWORD }} --temporary=false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Create env vars
        run: |
          echo "AUTH_KEYCLOAK_ID=client-id" >> .env.local
          echo "AUTH_KEYCLOAK_SECRET=${{ secrets.KEYCLOAK_SECRET }}" >> .env.local
          echo "NEXT_PUBLIC_AUTH_KEYCLOAK_ISSUER=http://localhost:8080/realms/myrealm" >> .env.local
          echo "NEXTAUTH_URL=http://localhost:5000" >> .env.local
          npx auth secret
          jq -n \
          --arg domain "http://localhost:8080" \
          --arg username "${{ secrets.KEYCLOAK_REALM_USERNAME }}" \
          --arg password "${{ secrets.KEYCLOAK_REALM_PASSWORD }}" \
          '{AUTH_DOMAIN: $domain, AUTH_USERNAME: $username, AUTH_PASSWORD: $password}' > cypress.env.json

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Run tests
        run: make app-tests
